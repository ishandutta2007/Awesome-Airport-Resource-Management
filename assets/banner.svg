<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="radar-glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" />

  <!-- Dynamic Animated Elements (In Background Layer) -->
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Animated Radar / Flight Path Rings (Background Right) -->
  <g transform="translate(1000, 150)" opacity="0.25">
    <circle r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
    <circle r="70" fill="none" stroke="#818cf8" stroke-width="1" />
    <circle r="30" fill="none" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Flight Path 1 with Moving Airplane -->
  <path id="flight-path-1" d="M -50 220 Q 300 80 600 180 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35" />
  <g filter="url(#radar-glow)">
    <path d="M 0 -8 L 12 0 L 0 8 L 2 2 L -8 4 L -6 0 L -8 -4 L 2 -2 Z" fill="#38bdf8">
      <animateMotion dur="12s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flight-path-1" />
      </animateMotion>
    </path>
  </g>

  <!-- Flight Path 2 with Moving Airplane -->
  <path id="flight-path-2" d="M -50 80 Q 400 240 800 100 T 1250 220" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <g filter="url(#radar-glow)">
    <path d="M 0 -8 L 12 0 L 0 8 L 2 2 L -8 4 L -6 0 L -8 -4 L 2 -2 Z" fill="#818cf8">
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
        <mpath href="#flight-path-2" />
      </animateMotion>
    </path>
  </g>

  <!-- Pulsing Airport Signal Nodes -->
  <circle cx="200" cy="120" r="4" fill="#38bdf8">
    <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="210" r="4" fill="#c084fc">
    <animate attributeName="r" values="4;10;4" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Content Layer (Stays sharp and on top) -->
  <!-- Icon / Badge -->
  <g transform="translate(80, 85)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Tower / Radar Icon -->
    <path d="M35 15 L45 55 L25 55 Z M35 15 L35 55 M20 25 L50 25 M23 35 L47 35 M27 45 L43 45" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="35" cy="15" r="3" fill="#38bdf8" />
  </g>

  <!-- Main Title -->
  <text x="175" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="url(#title-grad)" letter-spacing="0.5">
    Awesome Airport Resource Management
  </text>

  <!-- Subtitle -->
  <text x="175" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#94a3b8" letter-spacing="0.2">
    Curated SaaS Platforms, Gate Allocation Engines, AODB &amp; Real-Time Optimization Tools
  </text>

  <!-- Tag Pills -->
  <g transform="translate(175, 190)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">✈️ Gate Allocation</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="195" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">📡 AODB Suites</text>

    <!-- Pill 3 -->
    <rect x="260" y="0" width="145" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="332" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">⚡ Ground Handling</text>
  </g>
</svg>
